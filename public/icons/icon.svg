<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#f97316" stroke-opacity="0.3" stroke-width="4"/>
  
  <!-- Outer Flame Glow -->
  <path d="M256 64 C230 140 170 190 170 270 C170 340 210 390 256 390 C302 390 342 340 342 270 C342 190 282 140 256 64 Z" 
        fill="url(#flame)" filter="url(#glow)" opacity="0.4"/>

  <!-- Main Flame -->
  <path d="M256 80 C234 150 180 200 180 275 C180 340 215 385 256 385 C297 385 332 340 332 275 C332 200 278 150 256 80 Z" 
        fill="url(#flame)"/>

  <!-- Inner Core Flame -->
  <path d="M256 180 C242 225 210 255 210 300 C210 345 230 375 256 375 C282 375 302 345 302 300 C302 255 270 225 256 180 Z" 
        fill="#fef08a"/>
</svg>
